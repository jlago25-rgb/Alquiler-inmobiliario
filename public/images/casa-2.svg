<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky2)"/>
  <rect y="370" width="800" height="130" fill="#d1fae5"/>
  <!-- Contemporary 2-story box house -->
  <rect x="170" y="235" width="460" height="150" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="210" y="135" width="330" height="105" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="195" y="125" width="360" height="16" rx="2" fill="#132a46"/>
  <rect x="155" y="230" width="490" height="12" fill="#1b7a6e"/>
  <!-- Upper panoramic glass -->
  <rect x="240" y="155" width="165" height="65" rx="3" fill="#bae6fd" stroke="#132a46" stroke-width="3"/>
  <rect x="425" y="155" width="90" height="65" rx="3" fill="#bae6fd" stroke="#132a46" stroke-width="3"/>
  <!-- Garage & entry -->
  <rect x="200" y="275" width="150" height="110" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="305" x2="350" y2="305" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="200" y1="335" x2="350" y2="335" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="200" y1="365" x2="350" y2="365" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="385" y="290" width="58" height="95" rx="3" fill="#132a46"/>
  <rect x="470" y="275" width="130" height="75" rx="3" fill="#bae6fd" stroke="#132a46" stroke-width="3"/>
  <rect x="180" y="385" width="440" height="16" fill="#cbd5e1"/>
</svg>
